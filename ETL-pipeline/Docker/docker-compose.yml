version: '3.8'

services:
  db:
    image: postgres:14  # use version 14 to avoid 18+ issue
    restart: always
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: etl-pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
  

  etl:
    # volumes: 
    #   - ./output:/app/output
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: etl-pipeline
    command: ["python", "etl_pipeline.py"]


  

volumes:
  pgdata: 
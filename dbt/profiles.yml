pipeline_dbt:
  target: dev_local
  outputs:
    dev_local:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      port: 5432
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: public
      threads: 4
    staging:
      type: postgres
      host: "{{ env_var('STAGING_DB_HOST') }}"
      port: 5432
      user: "{{ env_var('STAGING_DB_USER') }}"
      password: "{{ env_var('STAGING_DB_PASSWORD') }}"
      dbname: "{{ env_var('STAGING_DB_NAME') }}"
      schema: public
      threads: 4
      sslmode: require
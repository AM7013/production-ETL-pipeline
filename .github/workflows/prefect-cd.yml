name: CD pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed


jobs:
  approval:
    runs-on: ubuntu-latest
    if : ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: Production/Deployment
    steps:
      - name: Request approval
        run: echo "[WAITING] Approval required to deploy Prefect ETL Pipeline to production..."
        
  deploy:
    needs: approval
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dbt profiles.yml
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ] || [ -z "$DB_NAME" ]; then
            echo "One or more DB secrets are missing"
            exit 1
          fi

          mkdir -p dbt
          cat > dbt/profiles.yml << EOF
          pipeline_dbt:
            target: ci
            outputs:
              ci:
                type: postgres
                host: "$DB_HOST"
                port: 5432
                user: "$DB_USER"
                password: "$DB_PASSWORD"
                dbname: "$DB_NAME"
                schema: public
                threads: 4
                sslmode: require
          EOF

          echo "Created dbt/profiles.yml"
          sed 's/password:.*/password: ****/' dbt/profiles.yml


      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt \
            pandas \
            pandas-gbq \
            prefect \
            prefect-shell \
            pyspark \
            psycopg2-binary \
            python-dotenv \
            dbt-core \
            dbt-postgres

      - name: install dbt packages
        run: |
          cd dbt
          dbt deps
          dbt build --target ci

      - name: Run Prefect Flow
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY_DEV }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          CSV_FILENAME: ../samples/cleaned_data_test.csv
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
        run: |
          echo '${{ secrets.GCP_KEY }}' > gcp-key.json
          echo "[INFO] Starting Prefect flow in production... "
          python run_cd.py

  deploy-tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: Production/Deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dbt profiles.yml
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mkdir -p dbt
          cat > dbt/profiles.yml << EOF
          pipeline_dbt:
            target: ci
            outputs:
              ci:
                type: postgres
                host: "$DB_HOST"
                port: 5432
                user: "$DB_USER"
                password: "$DB_PASSWORD"
                dbname: "$DB_NAME"
                schema: public
                threads: 4
                sslmode: require
          EOF

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt \
            pandas \
            pandas-gbq \
            prefect \
            pyspark \
            psycopg2-binary \
            prefect-shell \
            python-dotenv \
            dbt-core \
            dbt-postgres

      - name: Run prefect flow (TAGGING)
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY_PROD }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          CSV_FILENAME: ../samples/cleaned_data_test.csv
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
          
        run: |
          echo '${{ secrets.GCP_KEY }}' > gcp-key.json
          python run_cd.py --tag
          
      - name: Create Deployment Tag
        if: success()
        run: |
          DATE=$(date +'%Y-%m-%d')
          
          VERSION="v1.0.${{ github.run_number }}"  
          
          TAG_NAME="${VERSION}-${DATE}"
          
          echo "[PROCESS] Creating deployment tag: $TAG_NAME"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a $TAG_NAME -m "Production deployment - $DATE"
          git push origin $TAG_NAME
          
          echo "[GREEN] Successfully created and pushed tag: $TAG_NAME"
          echo "Version: $VERSION"


  notify:
      needs: [approval, deploy]
      runs-on: ubuntu-latest
      environment: dev
      if: always()                
      steps:
        - name: Notify on CD Result
          uses: actions/github-script@v7
          with:
            script: |
              const status = '${{ needs.deploy.result }}';
              let emoji = status === 'success' ? '[GREEN]' : '[RED]';
              let title = status === 'success' ? 'CD Pipeline Succeeded' : 'CD Pipeline Failed';
              
              const message = `${emoji} **${title}**

              **Workflow:** ${context.workflow}
              **Branch:** ${context.ref}
              **Commit:** ${context.sha}
              **Run URL:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

              Status: **${status.toUpperCase()}**`;

              if (context.issue.number) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: message
                });
              }

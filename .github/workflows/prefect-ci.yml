name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  Prefect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        
      - name: Create dbt profiles.yml
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ] || [ -z "$DB_NAME" ]; then
            echo "One or more DB secrets are missing"
            exit 1
          fi

          mkdir -p dbt
          cat > dbt/profiles.yml << EOF
          pipeline_dbt:
            target: ci
            outputs:
              ci:
                type: postgres
                host: "$DB_HOST"
                port: 5432
                user: "$DB_USER"
                password: "$DB_PASSWORD"
                dbname: "$DB_NAME"
                schema: public
                threads: 4
                sslmode: require
              staging:
                type: postgres
                host: "{{ env_var('STAGING_DB_HOST') }}"
                port: 5432
                user: "{{ env_var('STAGING_DB_USER') }}"
                password: "{{ env_var('STAGING_DB_PASSWORD') }}"
                dbname: "{{ env_var('STAGING_DB_NAME') }}"
                schema: public
                threads: 4
                sslmode: require
          EOF

          echo "Created dbt/profiles.yml"
          sed 's/password:.*/password: ****/' dbt/profiles.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Verify Java Installation
        run: |
          java -version
          echo "[GREEN] Java 17 installed successfully"
          
     
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os}}-pip-${{ hashFiles('**/requirements.txt')}}
          restore-keys: |
            ${{ runner.os}}-pip-


      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt \
            pandas \
            pandas-gbq \
            prefect \
            prefect-shell \
            pyspark \
            psycopg2-binary \
            python-dotenv \
            dbt-core \
            dbt-postgres

      - name: install dbt packages
        run: |
          cd dbt
          dbt deps
          dbt build --target ci

      - name: Check Prefect Flow Import
        run: |
          python -c '
          import sys
          import os
          sys.path.insert(0, os.path.join(os.getcwd(), "orchestration", "Prefect"))

          
          from etl_flow import etl_pipeline
          print("[GREEN] Prefect flow imported successfully")
          '

  validation:
    needs: Prefect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt \
            pandas \
            pandas-gbq \
            prefect \
            pyspark \
            psycopg2-binary \
            prefect-shell \
            python-dotenv

      
      - name: Test Flow Dry Run Parameter
        run: |
          python -c "
          import sys
          import os
          sys.path.insert(0, os.path.join(os.getcwd(), 'orchestration', 'Prefect'))
          
          from etl_flow import etl_pipeline
          etl_pipeline(target_date='2027-01-01', dry_run=True)
          print('[GREEN] Dry run parameter verified successfully')
          "

      - name: Run unit tests with coverage
        working-directory: orchestration/Prefect
        run: |
          pip install pytest-cov
          python -m pytest tests -v \
            --cov=tasks --cov=etl_flow \
            --cov-report=term-missing \
            --cov-report=xml:${{ github.workspace }}/coverage.xml \
            --junitxml=${{ github.workspace }}/pytest-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            pytest-report.xml
          retention-days: 7

      - name: Verify Spark Session Creation
        run: |
          python -c "
          from pyspark.sql import SparkSession
          spark = SparkSession.builder.appName('CI_Spark_Test').config('spark.sql.adaptive.enabled', 'false').getOrCreate()
          print(f'[GREEN] Spark Version: {spark.version}')
          spark.stop()
          "



  docker:
    needs: validation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt \
            pandas \
            pandas-gbq \
            prefect \
            pyspark \
            psycopg2-binary \
            prefect-shell \
            python-dotenv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build with Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./orchestration/Docker/Dockerfile
          push: false
          tags: prefect-etl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

        

      - name: Run Prefect Flow
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_URI }}
        run: |
          python -c "
          import sys
          import os
          sys.path.insert(0, os.path.join(os.getcwd(), 'orchestration', 'Prefect'))
          from etl_flow import etl_pipeline

          if not os.getenv('DB_CONNECTION_STRING'):
              print('[RED] DB_CONNECTION_STRING environment variable is not set')
              sys.exit(1)


          print('Running Prefect flow in dry-run mode...')
          etl_pipeline(target_date='2027-01-01', dry_run=True)
          print('[GREEN] Prefect flow executed successfully')
          "

  security:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for Vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2023-1234 --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-2281 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-248
          echo "[GREEN] Dependency security scan passed"

      - name: CodeQL Security Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build with Cache (for Trivy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./orchestration/Docker/Dockerfile
          push: false
          load: true
          tags: prefect-etl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run TruffleHog (secrets scan)
        run: |
          trufflehog --filesystem . --no-update --fail || echo "[WARN] TruffleHog found secrets"

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Trivy (Docker Scan)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --cache-dir /tmp/trivy-cache \
            prefect-etl:latest
          echo "[GREEN] Trivy scan completed"

  Notify:
    needs: [Prefect, validation, docker, security]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const message = `[RED] **CI Pipeline Failed**

            **Workflow:** ${context.workflow}
            **Branch:** ${context.ref}
            **Commit:** ${context.sha}
            **Run URL:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Please check the logs.`;

            if (context.issue.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }